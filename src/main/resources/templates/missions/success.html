<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div th:if="${success}" class="alert alert-success">
            <h4>✅ Успешно!</h4>
            <p th:text="${success}"></p>
        </div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div class="card" th:if="${mission}">
            <div class="card-header">
                <h5>Загруженная миссия</h5>
            </div>
            <div class="card-body">
                <p><strong>ID:</strong> <span th:text="${mission.missionId}"></span></p>
                <p><strong>Дата:</strong> <span th:text="${mission.date}"></span></p>
                <p><strong>Локация:</strong> <span th:text="${mission.location} ?: 'Данных нет'"></span></p>
                <p><strong>Исход:</strong> <span th:text="${mission.outcome} ?: 'Данных нет'"></span></p>
            </div>
        </div>

        <div class="mt-4">
            <a href="/missions" class="btn btn-primary">Вернуться к списку</a>
            <a href="/missions/upload" class="btn btn-success">Загрузить ещё одну</a>
        </div>
    </div>
</body>
</html>
