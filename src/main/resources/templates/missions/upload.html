<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 th:text="${pageTitle}"></h1>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        
        <form method="post" enctype="multipart/form-data" action="/missions/upload">
            <div class="mb-3">
                <label class="form-label">Файл миссии</label>
                <input type="file" name="file" class="form-control" accept=".json,.yaml,.yml,.xml,.txt" required>
            </div>
            <button type="submit" class="btn btn-success">Загрузить и сохранить в архив</button>
        </form>
        
        <a href="/missions" class="btn btn-secondary mt-3">Назад к списку</a>
    </div>
</body>
</html>
